name: Mise a jour des clips Twitch

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h (heure de Paris)
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recuperer les clips
        run: node scripts/fetch-clips.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Enregistrer clips.json s'il a change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clips.json
          git diff --cached --quiet || (git commit -m "Mise a jour des clips Twitch" && git push)
