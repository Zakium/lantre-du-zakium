name: Mise a jour automatique (images Steam, pages de partage, clips Twitch)

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h (heure de Paris)
  push:
    paths:
      - "data.js"           # et a chaque modification de data.js
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write
  pages: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Images Steam
        continue-on-error: true
        run: node scripts/fetch-steam-images.mjs

      - name: Pages de partage des reviews
        continue-on-error: true
        run: node scripts/build-share-pages.mjs

      - name: Clips Twitch
        continue-on-error: true
        run: node scripts/fetch-clips.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Enregistrer les fichiers s'ils ont change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in steam-images.json clips.json; do [ -f "$f" ] && git add "$f"; done
          git add -A r 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Mise a jour auto" && git pull --rebase && git push)

      - name: Republier le site
        continue-on-error: true
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Republication demandee"
        env:
          GH_TOKEN: ${{ github.token }}
